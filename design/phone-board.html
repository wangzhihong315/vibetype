<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>VibeType · 手机端</title>
<link rel="stylesheet" href="board.css" />
</head>
<body>

<div class="board-head">
  <h1>VibeType · 手机端</h1>
  <p>一块触控板 + 语音键 + 胶囊键 + 五个常用键，所有动效直接浮在触控板上。共 19 个界面。</p>
  <div class="meta">Android · 390 × 844 · 2026-11-11</div>
</div>

<div class="board phones">

  <!-- R1 空闲 -->
  <figure>
    <div class="phone"><div class="screen" data-remote="idle">
      <div class="content remote-content">
        <div class="rhead">
          <span class="pill ok"><i class="dot"></i><span>MacBook Pro 已连接</span></span>
          <span class="gear"><svg viewBox="0 0 24 24"><path d="M4 7h7M17 7h3M4 17h3M13 17h7"/><circle cx="14" cy="7" r="2.2"/><circle cx="8.5" cy="17" r="2.2"/></svg></span>
        </div>
        <div class="pad">
          <svg class="cursor" viewBox="0 0 24 30" fill="none"><path d="M4 3l14 11-6.2 1.2L15 23l-3 1.4-3.2-7.6L4 20V3Z" fill="#fff" stroke="#0b0b0c" stroke-width="1.4" stroke-linejoin="round"/></svg>
          <div class="pad-hint">轻点左键 · 双指/右缘滚动 · 长按拖动</div>
        </div>
      </div>
      <div class="homebar"></div>
    </div></div>
    <figcaption><b>R1 · 遥控器 / 空闲</b><br>触控板是主角，按键都在拇指够得到的地方</figcaption>
  </figure>

  <!-- R2 语音中 -->
  <figure>
    <div class="phone"><div class="screen" data-remote="voice">
      <div class="content remote-content">
        <div class="rhead">
          <span class="pill ok"><i class="dot"></i><span>MacBook Pro 已连接</span></span>
          <span class="gear"><svg viewBox="0 0 24 24"><path d="M4 7h7M17 7h3M4 17h3M13 17h7"/><circle cx="14" cy="7" r="2.2"/><circle cx="8.5" cy="17" r="2.2"/></svg></span>
        </div>
        <div class="pad">
          <div class="pad-overlay">
            <div class="voice-float"><i></i><i></i><i></i><i></i><i></i></div>
            <div class="float-timer">00:03.2</div>
            <div class="float-label">松开结束，文字会打进电脑光标</div>
          </div>
        </div>
      </div>
      <div class="homebar"></div>
    </div></div>
    <figcaption><b>R2 · 按住语音键</b><br>光晕和计时浮在触控板上，不换页</figcaption>
  </figure>

  <!-- R3 胶囊录制 -->
  <figure>
    <div class="phone"><div class="screen" data-remote="capsule">
      <div class="content remote-content">
        <div class="rhead">
          <span class="pill ok"><i class="dot"></i><span>MacBook Pro 已连接</span></span>
          <span class="gear"><svg viewBox="0 0 24 24"><path d="M4 7h7M17 7h3M4 17h3M13 17h7"/><circle cx="14" cy="7" r="2.2"/><circle cx="8.5" cy="17" r="2.2"/></svg></span>
        </div>
        <div class="pad">
          <div class="pad-overlay">
            <div class="capsule-float"><i></i><i></i><i></i><i></i><i></i></div>
            <div class="float-timer">00:07.4</div>
            <div class="float-label">松开保存，自动转写进胶囊</div>
          </div>
        </div>
      </div>
      <div class="homebar"></div>
    </div></div>
    <figcaption><b>R3 · 按住胶囊键</b><br>同一个触控板，换一种浮层和颜色</figcaption>
  </figure>

  <!-- R4 转写中 -->
  <figure>
    <div class="phone"><div class="screen" data-remote="idle">
      <div class="content remote-content">
        <div class="rhead">
          <span class="pill ok"><i class="dot"></i><span>MacBook Pro 已连接</span></span>
          <span class="gear"><svg viewBox="0 0 24 24"><path d="M4 7h7M17 7h3M4 17h3M13 17h7"/><circle cx="14" cy="7" r="2.2"/><circle cx="8.5" cy="17" r="2.2"/></svg></span>
        </div>
        <div class="pad">
          <div class="pad-overlay">
            <div class="float-card">
              <span class="spin"></span>
              <div><b>转写中…</b><span>SenseVoice 在本机跑，不联网</span></div>
            </div>
          </div>
        </div>
      </div>
      <div class="homebar"></div>
    </div></div>
    <figcaption><b>R4 · 转写中</b><br>一秒内的等待，不打断手指位置</figcaption>
  </figure>

  <!-- R5 已上屏 -->
  <figure>
    <div class="phone"><div class="screen" data-remote="idle">
      <div class="content remote-content">
        <div class="rhead">
          <span class="pill ok"><i class="dot"></i><span>MacBook Pro 已连接</span></span>
          <span class="gear"><svg viewBox="0 0 24 24"><path d="M4 7h7M17 7h3M4 17h3M13 17h7"/><circle cx="14" cy="7" r="2.2"/><circle cx="8.5" cy="17" r="2.2"/></svg></span>
        </div>
        <div class="pad">
          <svg class="cursor" viewBox="0 0 24 30" fill="none"><path d="M4 3l14 11-6.2 1.2L15 23l-3 1.4-3.2-7.6L4 20V3Z" fill="#fff" stroke="#0b0b0c" stroke-width="1.4" stroke-linejoin="round"/></svg>
          <div class="pad-toast">
            <span class="tick"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.2 4.2L19 7"/></svg></span>
            <div class="txt"><b>已上屏 · 0.4s</b>帮我用 Swift 写一个解析 JSON 的函数，要带错误处理。</div>
          </div>
          <div class="pad-hint">轻点左键 · 双指滚动 · 长按拖动</div>
        </div>
      </div>
      <div class="homebar"></div>
    </div></div>
    <figcaption><b>R5 · 已上屏</b><br>结果以浮层确认，触控板还能继续用</figcaption>
  </figure>

  <!-- R6 未连接 -->
  <figure>
    <div class="phone"><div class="screen" data-remote="off">
      <div class="content remote-content">
        <div class="rhead">
          <span class="pill"><i class="dot"></i><span>未连接</span></span>
          <span class="gear"><svg viewBox="0 0 24 24"><path d="M4 7h7M17 7h3M4 17h3M13 17h7"/><circle cx="14" cy="7" r="2.2"/><circle cx="8.5" cy="17" r="2.2"/></svg></span>
        </div>
        <div class="pad">
          <div class="pad-off"><b>先连上电脑</b><span>配对之后，触控板和按键才有用</span></div>
        </div>
      </div>
      <div class="homebar"></div>
    </div></div>
    <figcaption><b>R6 · 未连接</b><br>整块台面变暗，按键禁用，不假装能用</figcaption>
  </figure>

  <!-- R7 上屏失败 -->
  <figure>
    <div class="phone"><div class="screen" data-remote="idle">
      <div class="content remote-content">
        <div class="rhead">
          <span class="pill ok"><i class="dot"></i><span>MacBook Pro 已连接</span></span>
          <span class="gear"><svg viewBox="0 0 24 24"><path d="M4 7h7M17 7h3M4 17h3M13 17h7"/><circle cx="14" cy="7" r="2.2"/><circle cx="8.5" cy="17" r="2.2"/></svg></span>
        </div>
        <div class="pad">
          <div class="pad-toast bad">
            <span class="tick"><svg viewBox="0 0 24 24"><path d="M12 7v6M12 16.5v.5"/></svg></span>
            <div class="txt"><b>电脑端没上屏</b>辅助功能权限被收回了，去电脑上重新授权。</div>
            <span class="go">重发</span>
          </div>
          <div class="pad-hint">文字还在手机里，不会丢</div>
        </div>
      </div>
      <div class="homebar"></div>
    </div></div>
    <figcaption><b>R7 · 上屏失败</b><br>失败浮层说明原因，并保留重发</figcaption>
  </figure>

  <!-- R8 胶囊列表 -->
  <figure>
    <div class="phone"><div class="screen" data-remote="idle">
      <div class="content remote-content">
        <div class="rhead">
          <span class="pill ok"><i class="dot"></i><span>MacBook Pro 已连接</span></span>
          <span class="gear"><svg viewBox="0 0 24 24"><path d="M4 7h7M17 7h3M4 17h3M13 17h7"/><circle cx="14" cy="7" r="2.2"/><circle cx="8.5" cy="17" r="2.2"/></svg></span>
        </div>
        <div class="pad">
          <svg class="cursor" viewBox="0 0 24 30" fill="none"><path d="M4 3l14 11-6.2 1.2L15 23l-3 1.4-3.2-7.6L4 20V3Z" fill="#fff" stroke="#0b0b0c" stroke-width="1.4" stroke-linejoin="round"/></svg>
        </div>
      </div>
      <div class="scrim"></div>
      <div class="sheet tall">
        <div class="sheet-grab"></div>
        <div class="sheet-head"><h3>闪念胶囊 <span class="count">3</span></h3><span class="done">完成</span></div>
        <div class="seg"><span class="on">全部</span><span>未转写</span></div>
        <div class="sheet-list">
          <div class="capsule">
            <div class="time">今天 21:04 <span class="status">已转写</span></div>
            <div class="body">把下载链接放到 README 最上面，顺便补一个英文版。</div>
            <div class="dur">0:06 · 已同步到电脑</div>
          </div>
          <div class="capsule">
            <div class="time">今天 18:22 <span class="status wait">待转写</span></div>
            <div class="body">胶囊要和语音输入分开入口，按住说话是即时的，胶囊是攒下来的。</div>
            <div class="dur">0:12 · 只在手机</div>
          </div>
          <div class="capsule">
            <div class="time">昨天 09:15 <span class="status">已转写</span></div>
            <div class="body">问一下 K80 上 SenseVoice 的 RTF，还有 JSON 这种词能不能纠正。</div>
            <div class="dur">0:04 · 只在手机</div>
          </div>
        </div>
      </div>
      <div class="homebar"></div>
    </div></div>
    <figcaption><b>R8 · 胶囊列表</b><br>轻点胶囊键从底部滑出，不离开遥控器</figcaption>
  </figure>

  <!-- R9 胶囊空态 -->
  <figure>
    <div class="phone"><div class="screen" data-remote="idle">
      <div class="content remote-content">
        <div class="rhead">
          <span class="pill ok"><i class="dot"></i><span>MacBook Pro 已连接</span></span>
          <span class="gear"><svg viewBox="0 0 24 24"><path d="M4 7h7M17 7h3M4 17h3M13 17h7"/><circle cx="14" cy="7" r="2.2"/><circle cx="8.5" cy="17" r="2.2"/></svg></span>
        </div>
        <div class="pad">
          <svg class="cursor" viewBox="0 0 24 30" fill="none"><path d="M4 3l14 11-6.2 1.2L15 23l-3 1.4-3.2-7.6L4 20V3Z" fill="#fff" stroke="#0b0b0c" stroke-width="1.4" stroke-linejoin="round"/></svg>
        </div>
      </div>
      <div class="scrim"></div>
      <div class="sheet tall">
        <div class="sheet-grab"></div>
        <div class="sheet-head"><h3>闪念胶囊 <span class="count">0</span></h3><span class="done">完成</span></div>
        <div class="sheet-empty">
          <div class="empty-capsule">＋</div>
          <h3>还没有胶囊</h3>
          <p>按住遥控器上的胶囊键，把刚才想到的那句话留下来。</p>
        </div>
      </div>
      <div class="homebar"></div>
    </div></div>
    <figcaption><b>R9 · 胶囊空态</b><br>空的时候告诉用户按哪个键</figcaption>
  </figure>

  <!-- R10 胶囊详情 -->
  <figure>
    <div class="phone"><div class="screen">
      <div class="content">
        <div class="detail-bar"><span class="chev"></span><span>7 月 18 日 21:04</span></div>
        <div class="detail-text">把下载链接放到 README 最上面，顺便补一个英文版。</div>
        <div class="detail-meta"><span>0:06</span><span>·</span><span style="color:#1f9d43">已转写</span></div>
        <div class="spacer"></div>
        <div class="detail-actions">
          <div class="action">复制文字</div>
          <div class="action primary">发到电脑光标</div>
          <div class="action danger">删除这条胶囊</div>
        </div>
        <p class="note" style="text-align:center;margin-top:14px;">胶囊只存在这台手机，除非你主动发到电脑。</p>
      </div>
      <div class="homebar"></div>
    </div></div>
    <figcaption><b>R10 · 胶囊详情</b><br>复制、上屏、删除收在底部</figcaption>
  </figure>

  <!-- R11 手势说明 -->
  <figure>
    <div class="phone"><div class="screen" data-remote="idle">
      <div class="content remote-content">
        <div class="rhead">
          <span class="pill ok"><i class="dot"></i><span>MacBook Pro 已连接</span></span>
          <span class="gear"><svg viewBox="0 0 24 24"><path d="M4 7h7M17 7h3M4 17h3M13 17h7"/><circle cx="14" cy="7" r="2.2"/><circle cx="8.5" cy="17" r="2.2"/></svg></span>
        </div>
        <div class="pad">
          <svg class="cursor" viewBox="0 0 24 30" fill="none"><path d="M4 3l14 11-6.2 1.2L15 23l-3 1.4-3.2-7.6L4 20V3Z" fill="#fff" stroke="#0b0b0c" stroke-width="1.4" stroke-linejoin="round"/></svg>
        </div>
      </div>
      <div class="scrim"></div>
      <div class="sheet">
        <div class="sheet-grab"></div>
        <h3>触控板手势</h3>
        <div class="gesture"><span class="g">单指移动</span><span>移动鼠标</span></div>
        <div class="gesture"><span class="g">轻点</span><span>左键</span></div>
        <div class="gesture"><span class="g">双指滑动</span><span>滚动页面</span></div>
        <div class="gesture"><span class="g">双指轻点</span><span>右键</span></div>
        <div class="gesture"><span class="g">长按拖动</span><span>按住左键拖拽</span></div>
        <div class="ok">知道了</div>
      </div>
      <div class="homebar"></div>
    </div></div>
    <figcaption><b>R11 · 手势说明</b><br>第一次进来自动弹一次，之后从设置进</figcaption>
  </figure>

  <!-- R12 设置 -->
  <figure>
    <div class="phone"><div class="screen">
      <div class="content">
        <h1 class="settings-title">设置</h1>
        <div class="group">
          <div class="label">电脑</div>
          <div class="box">
            <div class="srow">当前电脑<span class="val">MacBook Pro</span></div>
            <div class="srow">切换电脑<span class="arrow"></span></div>
            <div class="srow">移除配对<span class="arrow"></span></div>
          </div>
        </div>
        <div class="group">
          <div class="label">遥控器</div>
          <div class="box">
            <div class="srow">触控板灵敏度<span class="val">中</span><span class="arrow"></span></div>
            <div class="srow">自定义键<span class="val">调度中心</span><span class="arrow"></span></div>
            <div class="srow">手势说明<span class="arrow"></span></div>
            <div class="srow">左手模式<span class="switch"><i></i></span></div>
          </div>
        </div>
        <div class="group">
          <div class="label">转写</div>
          <div class="box">
            <div class="srow">识别语言<span class="val">自动</span><span class="arrow"></span></div>
            <div class="srow">数字与标点<span class="switch on"><i></i></span></div>
          </div>
        </div>
        <div class="group">
          <div class="label">胶囊</div>
          <div class="box">
            <div class="srow">自动转写<span class="switch on"><i></i></span></div>
            <div class="srow">同步到电脑<span class="switch"><i></i></span></div>
          </div>
        </div>
        <div class="group">
          <div class="label">关于</div>
          <div class="box">
            <div class="srow">版本与许可<span class="val">0.1.0</span><span class="arrow"></span></div>
          </div>
        </div>
      </div>
      <div class="homebar"></div>
    </div></div>
    <figcaption><b>R12 · 设置</b><br>遥控器、转写、胶囊、关于，四组到底</figcaption>
  </figure>

  <!-- R13 配对 -->
  <figure>
    <div class="phone"><div class="screen">
      <div class="content">
        <h1 class="h1">连接你的电脑</h1>
        <p class="lead">在电脑上打开 VibeType，窗口第一页会显示地址、端口和六位配对码。</p>
        <div class="card form">
          <div class="field focus"><label>电脑地址</label><div class="value">10.10.21.188</div></div>
          <div class="two">
            <div class="field"><label>端口</label><div class="value">47823</div></div>
            <div class="field"><label>配对码</label><div class="value">482 913</div></div>
          </div>
        </div>
        <div class="btn">连接</div>
        <div class="card steps">
          <div class="step"><b>1</b>电脑和手机连同一个 Wi-Fi</div>
          <div class="step"><b>2</b>抄下电脑窗口里的地址和配对码</div>
          <div class="step"><b>3</b>连上之后会自动重连</div>
        </div>
        <p class="note">录音只在手机本地转写，过网的只有文字。</p>
      </div>
      <div class="homebar"></div>
    </div></div>
    <figcaption><b>R13 · 配对</b><br>首次连接，一次把地址和码填完</figcaption>
  </figure>

  <!-- R14 配对失败 -->
  <figure>
    <div class="phone"><div class="screen">
      <div class="content">
        <h1 class="h1">连接你的电脑</h1>
        <p class="lead">在电脑上打开 VibeType，窗口第一页会显示地址、端口和六位配对码。</p>
        <div class="card form">
          <div class="field"><label>电脑地址</label><div class="value">10.10.21.188</div></div>
          <div class="two">
            <div class="field"><label>端口</label><div class="value">47823</div></div>
            <div class="field focus" style="border-color:#ff6b4a;box-shadow:0 0 0 3px rgba(255,107,74,.1);"><label>配对码</label><div class="value">482 913</div></div>
          </div>
        </div>
        <div class="btn">重新连接</div>
        <div class="error">配对码无效或已过期，电脑上的码每 3 分钟换一次。</div>
        <div class="card steps">
          <div class="step"><b>1</b>确认电脑上的 VibeType 还开着</div>
          <div class="step"><b>2</b>重新抄一次六位码，不要用旧的</div>
          <div class="step"><b>3</b>还不行就检查两边是不是同一个 Wi-Fi</div>
        </div>
      </div>
      <div class="homebar"></div>
    </div></div>
    <figcaption><b>R14 · 配对失败</b><br>错误说清原因，并直接给下一步</figcaption>
  </figure>

  <!-- R15 引导 -->
  <figure>
    <div class="phone"><div class="screen">
      <div class="content onboard">
        <div class="appmark"><i></i><i></i><i></i><i></i><i></i></div>
        <h1>一块触控板<br>指挥整台电脑</h1>
        <p class="lead">按住说话、记一条灵感、移动鼠标，全在这一屏。</p>
        <div class="points">
          <div class="point"><span class="ic"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="14" rx="3"/><path d="M11 9.5l5 4-2.2.6 1.2 2.4-1.8.9-1.2-2.4L11 17z"/></svg></span><div><b>触控板</b><span>单指移动、双指滚动，不用蓝牙。</span></div></div>
          <div class="point"><span class="ic"><svg viewBox="0 0 24 24"><path d="M4 12h2M8 8v8M12 5v14M16 9v6M20 12h0"/></svg></span><div><b>语音与胶囊</b><span>按住说，文字直接上屏；胶囊留给以后。</span></div></div>
          <div class="point"><span class="ic"><svg viewBox="0 0 24 24"><path d="M5 12h11M12 7l5 5-5 5"/></svg></span><div><b>只发文字</b><span>录音不出手机，局域网只走识别结果。</span></div></div>
        </div>
        <div class="perm">
          <span class="ic warn"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></span>
          <div class="txt"><b>麦克风未授权</b><span>按住说话需要它</span></div>
          <span class="grant">允许</span>
        </div>
        <div class="start">开始连接电脑</div>
      </div>
      <div class="homebar"></div>
    </div></div>
    <figcaption><b>R15 · 首次引导</b><br>先讲清楚这一屏能干什么，再要权限</figcaption>
  </figure>

  <!-- R16 双指滚动 -->
  <figure>
    <div class="phone"><div class="screen" data-remote="idle">
      <div class="content remote-content">
        <div class="rhead">
          <span class="pill ok"><i class="dot"></i><span>MacBook Pro 已连接</span></span>

<script>
  const STATUS = `
    <div class="statusbar"><span>9:41</span><span class="icons">
      <span class="signalbars"><i></i><i></i><i></i><i></i></span>
      <svg class="wifi" viewBox="0 0 16 12"><path d="M1 4.2C4.2 1.4 11.8 1.4 15 4.2" fill="none" stroke="#1d1d1f" stroke-width="1.4"/><path d="M3.4 6.8c2.4-2 6.8-2 9.2 0" fill="none" stroke="#1d1d1f" stroke-width="1.4"/><path d="M6 9.2c1.1-.9 2.9-.9 4 0" fill="none" stroke="#1d1d1f" stroke-width="1.4"/><circle cx="8" cy="10.7" r="0.8" fill="#1d1d1f"/></svg>
      <span class="battery"><i></i></span>
    </span></div>`;

  const KEYS = `
    <div class="key-grid">
      <div class="key" data-key="capsule"><span class="badge">2</span><svg viewBox="0 0 24 24"><rect x="9" y="3.5" width="6" height="17" rx="3"/><path d="M12 7.5v2.5"/></svg><span>胶囊</span></div>
      <div class="key"><svg viewBox="0 0 24 24"><path d="M20 6v6a2 2 0 0 1-2 2H5"/><path d="M9 10l-4 4 4 4"/></svg><span>回车</span></div>
      <div class="key"><svg viewBox="0 0 24 24"><path d="M20 6H9L3 12l6 6h11a1 1 0 0 0 1-1V7a1 1 0 0 0-1-1Z"/><path d="M12 10l4 4M16 10l-4 4"/></svg><span>删除</span></div>
      <div class="key"><span class="esc">esc</span></div>
      <div class="key"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="11" height="9" rx="2"/><rect x="10" y="10" width="11" height="9" rx="2"/></svg><span>切换</span></div>
      <div class="key"><svg viewBox="0 0 24 24"><path d="M12 4l2.2 5.2L20 10l-4 3.8 1 5.4-5-2.9-5 2.9 1-5.4L4 10l5.8-.8L12 4Z"/></svg><span>自定义</span></div>
    </div>`;

  function dock(state) {
    const voice =
      state === "voice" ? "voice-key pressed" :
      state === "off" ? "voice-key disabled" : "voice-key";
    const key = state === "off" ? "key disabled" : "key";
    const capsule = state === "capsule" ? "key pressed" : key;
    return `<div class="dock">
      <div class="${voice}"><span class="vbars"><i></i><i></i><i></i><i></i><i></i></span><span>按住说话</span></div>
      ${KEYS.replace('class="key" data-key="capsule"', `class="${capsule}" data-key="capsule"`)}
    </div>`;
  }

  document.querySelectorAll(".pad").forEach((pad) => {
    const screen = pad.closest(".screen");
    const active = screen?.dataset.edge === "active" ? " active" : "";
    pad.insertAdjacentHTML("beforeend", `<div class="edge-rail${active}"><span class="grip"></span></div>`);
  });

  document.querySelectorAll(".screen").forEach((screen) => {
    screen.insertAdjacentHTML("afterbegin", STATUS);
    const state = screen.dataset.remote;
    if (state) {
      const content = screen.querySelector(".content");
      content?.insertAdjacentHTML("beforeend", dock(state));
      if (screen.dataset.dock === "left") {
        const dockEl = content?.querySelector(".dock");
        if (dockEl) dockEl.style.flexDirection = "row-reverse";
      }
    }
  });
</script>
